<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen: research assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 2C54 30 70 46 98 50 70 54 54 70 50 98 46 70 30 54 2 50 30 46 46 30 50 2Z' fill='%23d9a58f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <main class="main" id="main"></main>
    <aside class="history" id="history" aria-label="Chat history"></aside>
  </div>
  <div id="popover" class="popover" role="tooltip" hidden></div>
  <div id="lightbox" class="lightbox" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <input type="file" id="filePicker" accept="application/pdf,.pdf" multiple hidden>
  <script src="app.js"></script>
</body>
</html>
